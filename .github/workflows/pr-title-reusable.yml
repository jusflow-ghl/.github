# Validates the PR title against the Conventional Commits rules in CONTRIBUTING.md.
# With squash and merge, the title becomes the final commit on main.
# Usage in each repository: see .github/workflows/pr-title.yml.
name: PR title (reusable)

on:
  workflow_call:

permissions: {}

jobs:
  conventional-commit:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^(${types})(\([a-z0-9-]+\))?!?: [^A-Z].*[^.]$"
          errors=()
          [[ "$TITLE" =~ $pattern ]] || errors+=("Title does not match <type>(<optional scope>): <description>.")
          (( ${#TITLE} <= 72 )) || errors+=("Title has ${#TITLE} characters; the maximum is 72.")
          if (( ${#errors[@]} )); then
            echo "Title: $TITLE"
            for e in "${errors[@]}"; do echo "::error title=Invalid PR title::$e"; done
            echo "Allowed types: ${types//|/, }"
            echo "Description in English, imperative mood, lowercase first letter, no trailing period."
            echo "Example: feat(gateway): verify X-GHL-Signature on raw body"
            echo "Guide: https://github.com/jusflow-ghl/.github/blob/main/CONTRIBUTING.md#commits"
            exit 1
          fi
          echo "Title OK: $TITLE"
